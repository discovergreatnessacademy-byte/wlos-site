<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">Winning Life OS — The Personal Operating System</title>
  <desc id="og-desc">Navy planner cover with gold wordmark reading Winning Life OS, tagline A Personal Operating System, and 2027 Edition · Ships Fall 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16233F"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFCF8" stop-opacity="0.06"/>
      <stop offset="45%" stop-color="#FDFCF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- planner cover card -->
  <rect x="430" y="95" width="340" height="440" rx="6" fill="#1B2A4A" stroke="#B08D3E" stroke-width="1.5"/>
  <rect x="430" y="95" width="340" height="440" rx="6" fill="url(#sheen)"/>
  <rect x="430" y="95" width="10" height="440" fill="#0E1830"/>

  <text x="600" y="255" text-anchor="middle" font-family="Georgia, 'Lora', serif" font-size="26" letter-spacing="4" fill="#C9D2E4">WINNING</text>
  <text x="600" y="300" text-anchor="middle" font-family="Georgia, 'Lora', serif" font-size="40" font-weight="600" letter-spacing="2" fill="#B08D3E">LIFE OS</text>
  <text x="600" y="336" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#C9D2E4">A PERSONAL OPERATING SYSTEM</text>

  <circle cx="600" cy="400" r="20" fill="none" stroke="#B08D3E" stroke-width="1.5"/>
  <circle cx="600" cy="400" r="12" fill="none" stroke="#B08D3E" stroke-width="1.5"/>

  <text x="600" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#B08D3E">2027 EDITION</text>
  <text x="600" y="492" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#B08D3E">SHIPS FALL 2026</text>

  <text x="600" y="580" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="6" fill="#C9D2E4">ONE MISSION · SEVEN PILLARS · FIFTY-TWO REVIEWS</text>
</svg>
